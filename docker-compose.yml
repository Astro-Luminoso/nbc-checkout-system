services:
  app:
    image: ${ECR_IMAGE:-nbc-checkout-system:latest}
    container_name: nbc-checkout-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:8
    container_name: nbc-checkout-mysql
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped

volumes:
  mysql_data:
